[package]
name = "tallis"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.1", features = ["v4"] }
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
regex = "1.12.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ocrs = "0.12.1"
rten = "0.24.0"
rayon = "1.11.0"
num_cpus = "1.16"
indicatif = "0.18.4"